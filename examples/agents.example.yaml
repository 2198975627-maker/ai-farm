# Copy to agents.yaml and edit. agents.yaml is gitignored — never commit it.
# One icon = one model. Same vendor paid + free = TWO entries.
# API: key_env is the ENV VAR NAME only, never the key itself.
# Web/subscription: login once in your own browser; session stays local.
agents:
  - name: "DeepSeek V4 Flash"
    slug: "deepseek-flash"
    role: "worker"
    vendor: "DeepSeek"
    model_id: "deepseek-v4-flash"
    access_kind: "api"
    paid: false
    key_env: "DEEPSEEK_API_KEY"
    base_url: "https://api.deepseek.com/v1"
    usage_url: "https://platform.deepseek.com/usage"

  - name: "DeepSeek V4 Pro"
