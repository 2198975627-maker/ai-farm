[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-farm"
version = "0.1.0"
description = "Open-source workbench for coordinating many AI models as one team"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

[project.scripts]
ai-farm = "ai_farm.cli:main"

[tool.setuptools.packages.find]
include = ["ai_farm*"]
